  notes: >
    The one-sided-node trap needed its sample rebuilt. A zigzag -- every node
    with exactly one child -- looks like the obvious test and does not work:
    such a tree has exactly one leaf, and a solution that stops at the first
    one-sided node also reports one, so it passes by accident. Case 02 is now
    a tree where each one-sided node leads to a subtree with several leaves,
    so stopping early undercounts: 4 against 2.
    The zigzag is still in the set, as case 12, where it does a different job
    -- maximum height with a single leaf.
