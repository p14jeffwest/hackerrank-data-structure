# Corresponding problem in the Korean repo.
# Taken over with its input format and bounds unchanged. One change: a third
# method. The Korean version asks for the leaf count and the height in edges;
# this book measures the same thing in nodes in 9.5, and its own answer page
# warns that the two differ by one and that the problem's definition has to be
# checked. Asking for both is what turns that warning into something a student
# has to act on.
