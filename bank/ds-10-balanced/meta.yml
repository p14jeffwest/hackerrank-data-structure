# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "308 ms (case 11, 200,000 keys)"
  scored_variants:
    - code: "middle by (lo + hi) / 2, ranges passed as indices (the registered solution)"
      score: "14/14"
    - code: "middle by (lo + hi + 1) / 2"
      score: "5/14, identical heights and different preorders"
    - code: "keys inserted in order, producing a spine"
      score: "2/14"
    - code: "copying a subList per call instead of passing indices"
      score: "14/14 -- not a mistake; see the note"
  notes: >
    THIS PROBLEM HAS NO PERFORMANCE DISCRIMINATION, and that was established
    by measurement rather than assumed. The obvious candidate for a slow
    solution -- copying a subarray at every call instead of passing indices --
    was written and scores 14/14, because the copying is O(n) per level and
    O(n log n) overall, not quadratic. There is no natural quadratic mistake
    here at all.
    So what the problem tests is entirely correctness: the midpoint rule, and
    the recursion producing a tree of minimum height. That is worth knowing
    before deciding whether 50 points is the right weight; on the evidence
    this is a Medium that sits in a Hard slot because it is the chapter's
    Level 3 walkthrough. Raised with the instructor.
    The two output lines check different things on purpose. A tree can have
    the right height and the wrong shape -- the (lo + hi + 1) / 2 variant is
    exactly that, matching every height and failing nine preorders.
