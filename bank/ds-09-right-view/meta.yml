# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "366 ms (case 10, 100,000 nodes)"
  scored_variants:
    - code: "level-order with levelSize (the registered solution)"
      score: "14/14"
    - code: "walk down the right children only"
      score: "4/14"
    - code: "level-order without separating the levels"
      score: "5/14"
    - code: "the FIRST node of each level, which is the left side view"
      score: "5/14"
    - code: "unmodified stub"
      score: "0/14"
  notes: >
    The whole problem is the one line `int levelSize = queue.size();`. Without
    it a queue is a flat stream and the level boundaries are gone; with it,
    each round handles exactly one level because whatever is added during the
    round belongs to the next.
    The misconception worth naming is that the visible node is a right child.
    It need not be: on a tree that leans left, every visible node is a left
    child, because at each level there is nothing else. Case 02 is the book's
    own example of that, and the right-children-only solution reports the root
    and stops.
