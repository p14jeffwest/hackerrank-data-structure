  notes: >
    The index-based mistake scores 8/14, and the shape of that score is the
    lesson: it passes every small case and fails every large one, so the
    student can read off that the logic was right and the traversal was not.
    This is the only problem in chapters 4 and 5 where the intended mistake is
    caught by the clock rather than by a wrong value, and it is therefore the
    one most exposed to the grader being slower or faster than this container.
    Values are capped at 10^8 rather than 10^9 so that ten times a value still
    fits in an int. Raising the cap would introduce an overflow this problem
    is not about.
