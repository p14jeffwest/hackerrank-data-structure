# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "290 ms (case 10)"
  scored_variants:
    - code: "merge sort with the count on the merge step (the registered solution)"
      score: "14/14"
    - code: "checking every pair, O(n^2)"
      score: "12/14 at a 5 s cutoff, 10/14 at 4 s -- see the note"
    - code: "< instead of <= in the merge, so equal values are counted"
      score: "10/14"
    - code: "counting in an int"
      score: "11/14"
    - code: "adding 1 per merge step instead of the remaining left size"
      score: "6/14"
  notes: >
    The quadratic solution is much more sensitive to the SHAPE of the input
    than to its size, which was measured rather than assumed. On random data
    (cases 10 and 13) it takes about 19 s; on the sorted and reverse-sorted
    arrays (cases 11 and 12) it takes 4.1 s -- a factor of 4.6 at identical
    n and identical comparison counts. The comparison there is perfectly
    predictable, so the branch predictor never misses.
    That puts cases 11 and 12 right at a four-second limit. Cases 10 and 13
    time it out decisively either way, so the mistake is caught regardless;
    but the score it earns will differ between graders and should not be
    quoted as exactly 10/14 or 12/14.
    The model counts with a Fenwick tree over compressed values, sweeping from
    the right, which shares no reasoning with the merge-sort method.
