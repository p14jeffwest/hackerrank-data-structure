# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "166 ms (case 12, 1,000 strings of about 1,000 characters)"
  scored_variants:
    - code: "narrow from both ends with a helper (the registered solution)"
      score: "14/14"
    - code: "comparison ignoring case"
      score: "8/14, wrong on 00 02 04 10 11 13"
    - code: "base case written low == high only"
      score: "3/14"
    - code: "recursing on (low + 1, high) instead of (low + 1, high - 1)"
      score: "5/14"
    - code: "unmodified stub"
      score: "1/14 -- it returns false, which is right for one case by luck"
  notes: >
    What no test can check is whether the method is recursive at all. A
    student can write s.equals(new StringBuilder(s).reverse().toString()) and
    score full marks, and there is no way to prevent that from the test data.
    The Korean counterpart accepts the same limitation, and so does this one;
    the recursion is asked for in the constraints and assessed on the exam.
    The base-case mistake is the interesting one. Writing `low == high`
    catches odd-length strings and misses even-length ones, where the range
    ends with low > high and the recursion runs past the ends of the string.
    Cases 01 and 03 separate the two parities deliberately.
