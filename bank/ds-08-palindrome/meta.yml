# Corresponding problem in the Korean repo.
# Taken over unchanged, including the input and output format, so that one
# explanation serves both courses. This book's own exercise at this point is
# "reverse a string recursively" rather than "is it a palindrome", but the two
# share the skeleton -- narrow a range from both ends -- so the Korean problem
# was kept in preference to inventing a second one.
