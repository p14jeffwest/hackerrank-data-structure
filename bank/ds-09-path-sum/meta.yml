  scored_variants:
    - code: "carry the remainder down, test at the leaf (the registered solution)"
      score: "14/14"
    - code: "a missing child answering `target == 0`"
      score: "7/14"
    - code: "the leaf testing `target == 0` rather than `target == node.data`"
      score: "1/14"
    - code: "abandoning a branch once the remainder goes negative"
      score: "9/14"
  notes: >
    The missing-child mistake is the one the problem is built around, and it
    is subtle: `if (node == null) return target == 0;` reads like a correct
    base case and quietly allows a path to stop at a one-sided node. Case 02
    is a chain of one-sided nodes whose partial sums are all offered as
    targets; the answer is false to every one of them and that solution says
    true to every one.
    The prune-on-negative mistake is correct whenever the values are all
    positive, which is why case 10 uses only positive values -- it keeps the
    mistake partial rather than total and shows the student which half of the
    input broke it.
    Each query re-walks the tree, so the cost is O(n * Q) = 10^8 in the worst
    case. That is fine at 900 ms and it is why Q is capped at 1,000 rather
    than raised further.
