  notes: >
    The output is formatted by the Tail with String.format(Locale.ROOT,
    "%.1f", ...). The Locale.ROOT matters: without it a grader running under a
    locale that uses a decimal comma would print "1,5" and every median would
    be marked wrong for a reason no student could diagnose.
    The doubles are exact here. Two values of at most 10^9 sum to at most
    2*10^9, which is well inside the range a double represents exactly, and
    halving it is exact too. The model nevertheless formats from integers so
    that it cannot agree with the solution by sharing a rounding assumption.
    The no-rebalancing variant scores 0/14 rather than partially, because
    without the corrective move every value ends up in `upper` and `lower`
    is empty -- findMedian then reads an empty heap and throws. Total, but
    diagnosed by sample 00.
