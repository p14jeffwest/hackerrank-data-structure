    - code: "sort by plain string order, descending"
      score: "8/14"
    - code: "no all-zeros case"
      score: "13/14, wrong only on 03"
  notes: >
    THE MODEL WAS WRONG FIRST TIME and the Java solution caught it. The
    comparator's sign was inverted, so gen.py sorted ascending and produced
    "3033459" for the book's own example instead of "9534330". Every case
    disagreed with the Java solution immediately. gen.py now has the
    comparison in a named function with the sign spelled out, and a note
    saying what went wrong.
    This is the one problem in the set where the model and the solution
    necessarily share their reasoning -- the required order IS the comparison,
    so there is no independent way to compute the answer. Running the two
    against each other is the only check available, which is exactly why it is
    always done.
    The all-zeros omission scores 13/14. It is a single special case and there
    is only one case that can test it, so sample 03 exists for that alone.
