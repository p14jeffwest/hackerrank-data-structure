      score: "0/14"
    - code: "move count printed as 2^n instead of 2^n - 1"
      score: "0/14"
  notes: >
    The println mistake is not caught here, and the numbers are worth
    recording: at N = 20 it takes 1.36 s writing to /dev/null and 2.40 s
    through a pipe, against 0.21 s for the reference. Slower than the correct
    solution by a factor of six to eleven, but probably still inside a
    four-second limit.
    Fixing that would mean N = 22, which quadruples the output to about 29 MB
    per case. That was judged not worth it: the lesson belongs to
    ds-tutorial-03-sum, which owns gathering output, and keeping N = 20 keeps
    this problem identical to the Korean one, which is the point of reusing
    it. Check the reported time on the live grader; if println times out
    there, so much the better.
    The peg-rotation mistake is the real content. It still prints exactly
    2^n - 1 lines, so the count is right and only the moves are wrong. That is
    why the move list is part of the answer rather than just the total.
