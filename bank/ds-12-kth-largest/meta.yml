# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "326 ms (case 13)"
  scored_variants:
    - code: "sort ascending, read nums[n-k] (the registered solution)"
      score: "14/14"
    - code: "a size-k min-heap"
      score: "14/14 -- the book's other method, also correct"
    - code: "take the maximum out k times, O(n*k)"
      score: "12/14, timing out on 12 and 13"
    - code: "reading nums[k-1] after an ascending sort"
      score: "2/14"
    - code: "counting distinct values instead of positions"
      score: "10/14, wrong on 01 04 05 12"
  notes: >
    12.8 Problem 1 is explicitly a comparison of two correct methods -- a full
    sort at O(n log n) and a size-k min-heap at O(n log k) -- so neither is
    excluded, and both were measured: 306-326 ms for the sort against 277-355
    ms for the heap. At n = 200,000 the choice does not show, which is worth
    saying to students rather than pretending otherwise. The exam question is
    when it would.
    What the bounds DO exclude is the approach students reach for first:
    take the maximum out k times. Cases 12 and 13 put k at n/2 and n, where
    that is 2*10^10 and 4*10^10 operations. Case 11 keeps k at 5 so the same
    mistake passes, which turns a total failure into a 12/14 that points at
    large k.
