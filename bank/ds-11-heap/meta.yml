# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "877 ms (case 13, 100,000 pushes then 100,000 pops)"
  scored_variants:
    - code: "the book's up-heap and down-heap (the registered solution)"
      score: "14/14"
    - code: "down-heap swapping with the LARGER child"
      score: "4/14"
    - code: "pop removing the root by shifting the array left"
      score: "5/14, and timing out on 10 and 13"
  notes: >
    A variant that overwrote the root before detaching the last element was
    written and turned out to be CORRECT, not wrong: setting index 0 to the
    last value and then removing the last is the same operation in the other
    order. Worth knowing when marking.
    A PriorityQueue-backed variant was also tried and is not representative:
    to answer `print` at all it has to maintain the visible array itself,
    which made it O(n) per operation and timed out for a reason unrelated to
    the mistake. What is true, and is the reason `print` exists, is that
    java.util.PriorityQueue does NOT lay its array out the way 11.3 does once
    removals are involved -- its sift-down differs -- so a solution built on
    it cannot reproduce these outputs.
    The `print` commands are spread through the large cases rather than left
    at the end. PriorityQueue's sift-UP is the same as the book's, so after a
    run of pushes the arrays agree; they only diverge after removals, and a
    single print at the end catches that far less often.
