# costs roughly (nodes) x (height), and at 100,000 nodes it finished in 1.6
# seconds -- comfortably inside a four-second limit. At 500,000 it takes 5.4
# seconds against the reference's 0.6.
node_cap: 500000
node_cap_elsewhere_in_ch09: 100000

# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "624 ms (case 13, 500,000 nodes at height 4,913)"
  scored_variants:
    - code: "one pass returning the height and updating a field (the registered solution)"
      score: "14/14"
    - code: "height(left) + height(right) at every node"
      score: "11/14, timing out on 13 and overflowing the stack on 09 and 12"
    - code: "measuring only through the root"
      score: "11/14, wrong on 02 08 12"
    - code: "empty subtree reported as 0, so the count is in nodes"
      score: "0/14"
    - code: "unmodified stub"
      score: "1/14 -- it returns 0, right for the single-node case"
  notes: >
    The quadratic solution fails in two different ways and it took three
    rounds of test data to make the first of them happen for the right reason.
    On the deep cases (09, 12) it overflows the stack, because it nests a
    height recursion inside a diameter recursion; that is a real failure but a
    marginal one, and it should not be the only thing catching it. Case 13 is
    the one that catches it on time: a caterpillar that is large and deep at
    once.
    Note that the node values are irrelevant to the answer. That is stated in
    the constraints so nobody wastes time looking for a weighting.
