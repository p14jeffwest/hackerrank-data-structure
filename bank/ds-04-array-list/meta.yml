  notes: >
    Section 4.2 of the book is not hidden, and item 10 of it prints the whole
    Array_List source. A student who copies it earns full marks, which is why
    this is a 10-point warm-up rather than a discriminator. The two traps that
    do bite are for students writing it themselves: the shift direction, and
    == versus .equals() on boxed Integers.
    Note also what no test can catch: dropping
    `list[numberOfEntries - 1] = null` from remove() changes no output at all,
    since toString only reads as far as numberOfEntries. It is a
    garbage-collection concern rather than a correctness one, and it can only
    be assessed by reading the code or by asking about it on an exam.
