# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "498 ms (case 11, 100,000 participants)"
  scored_variants:
    - code: "descending comparator on score only (the registered solution)"
      score: "14/14"
    - code: "sort ascending, then reverse the array"
      score: "4/14"
    - code: "comparator with a tie-break on name"
      score: "7/14"
    - code: "a hand-written selection sort"
      score: "10/14, and timing out on 11 12 13"
  notes: >
    Stability is the whole content, so ties are the whole test set: case 13 is
    100,000 participants on one score, where the answer is the input
    unchanged, and case 12 has five distinct scores across 100,000
    participants.
    The hand-written selection sort is the interesting variant. It is
    unstable, but a selection sort only disturbs a tie when it swaps across
    one, so it happens to survive most cases -- it fails just one on
    correctness (case 05) and the rest of its losses are timeouts from being
    quadratic. That is a reminder that "unstable" does not mean "visibly
    wrong on every input".
    Not a mistake: writing the comparator as y.score - x.score. Scores are at
    most 1,000, so it cannot overflow here. It is a bad habit rather than a
    bug in this problem, and no case punishes it.
