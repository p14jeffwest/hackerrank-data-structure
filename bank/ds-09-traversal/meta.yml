# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "636 ms (case 13, 100,000 nodes)"
  deepest_tree: "height 5,000 (cases 11 and 12)"
  scored_variants:
    - code: "the four traversals as written (the registered solution)"
      score: "14/14"
    - code: "inorder written with the visit first"
      score: "3/14"
    - code: "levelOrder delegating to preorder"
      score: "6/14"
    - code: "postorder stopping at leaves instead of checking for null"
      score: "4/14"
    - code: "unmodified stub"
      score: "0/14"
  notes: >
    The height cap of 5,000 is inherited from the Korean version and it is
    load-bearing rather than decorative. Three of the four traversals are
    recursive, so the stack depth is the height of the tree; a fully skewed
    tree of 100,000 nodes would overflow the Java stack and the correct
    solution would be the one that crashed. Cases 11 and 12 sit exactly at the
    cap.
    Case 03 exists to keep the level-order mistake partial. It is a tree of
    three nodes where preorder and level order coincide, so a student who
    confuses the two passes it and fails everything else.
