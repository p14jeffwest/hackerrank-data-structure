# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "595 ms (case 07, T = 500, sum of n = 500,000)"
  largest_output: "5.2 MB (case 08, k = 1)"
  scored_variants:
    - code: "monotonic deque of indices (the registered solution)"
      score: "14/14"
    - code: "recompute the maximum of each window, O(nk)"
      score: "10/14, timing out on 10 11 12 13"
    - code: "deque holds values instead of indices"
      score: "5/14"
    - code: "expiry tested with <= instead of <"
      score: "4/14"
    - code: "output starts at i >= k instead of i >= k - 1"
      score: "0/14"
  notes: >
    A brute-force scan costs (n - k + 1) windows of k elements, not n * k.
    The first version of gen.py reported n * k and, on that figure, case 09
    (k = n) looked like the most expensive case in the set at 2.5 * 10^11. It
    is in fact one of the cheapest: at k = n there is exactly one window. The
    brute-force variant scored 13/14 until cases 11, 12 and 13 were moved to
    window sizes near n/3 and n/2, where the product is genuinely large.
    Note what is NOT a mistake: dropping from the rear on `<` rather than
    `<=` leaves equal values in the deque and still reports the right maximum.
    The deque grows slightly and nothing else changes, so no test separates
    the two and none tries to.
