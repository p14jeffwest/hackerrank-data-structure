  notes: >
    THE BOOK'S "SORTING IS NOT ALLOWED" CANNOT BE ENFORCED, and it is not a
    close call: sorting is FASTER. Measured at n = 100,000 -- one long run,
    hash 197 ms against sort 228 ms; random values, hash 228 ms against sort
    191 ms. A HashSet of boxed Integers carries a large constant and
    Arrays.sort on an int[] carries a tiny one, so the log factor never
    catches up at any size this problem can hold. Stated in the constraints
    and assessed on the exam.
    What the clock DOES enforce is the start-of-run check, and decisively: on
    one shuffled run of 100,000 values the correct version took 197 ms and the
    version without the check took 15,717 ms. That is the point the book's own
    answer calls "the key", so the enforceable half is the half worth
    enforcing.
    Case 12 is random values with almost no runs. The O(n^2) mistake survives
    it -- there is nothing long to re-walk -- which keeps that mistake at
    10/14 and tells the student the long runs are what broke them.
