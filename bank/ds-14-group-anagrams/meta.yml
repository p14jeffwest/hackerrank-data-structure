# Deviations from the book, agreed before the problem was built.
changed_from_book:
  order:
    book: "the order within groups and among groups is free"
    here: >
      within a group, input order; groups in the order their first word
      appeared. A free order cannot be graded, and this particular one is what
      a LinkedHashMap gives -- so requiring it makes the chapter's own point
      testable, namely that a plain HashMap has no order at all.
  bounds:
    book: "n <= 10^4"
    here: "n <= 10^5, word length <= 20"

# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "386 ms (case 12, 100,000 words each in its own group)"
  scored_variants:
    - code: "sorted-letters key in a LinkedHashMap (the registered solution)"
      score: "14/14"
    - code: "the same, in a plain HashMap"
      score: "5/14"
    - code: "key made from the sum of the character codes"
      score: "10/14"
    - code: "the word itself as the key"
      score: "4/14"
    - code: "sorting the words within each group"
      score: "8/14"
  notes: >
    The sum-of-character-codes key is the interesting mistake. It scores
    10/14, because a collision needs two words whose letters sum alike without
    being anagrams -- "ad" and "bc" both come to 197 -- and random words
    rarely produce one at short lengths. Case 04 is built from such pairs on
    purpose, and the large cases 11 to 13 hit it by volume.
    The order requirement is not decoration: without it the problem cannot be
    graded at all, and with it the plain-HashMap solution -- which is the
    book's own code -- scores 5/14. Sample 03 exists so that is visible before
    submitting rather than after.
