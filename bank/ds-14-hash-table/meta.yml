  notes: >
    The print command is what makes this a hash-table problem rather than a
    map problem. A HashMap-backed solution answers every get correctly and
    scores 0/14, because it never fills the buckets. Same reasoning as
    ds-11-heap's print.
    Case 12 had to be cut down from 200,000 commands to 4,000. Its keys are
    all congruent, so every one of them lands in a single chain and each put
    walks the whole chain -- the work is quadratic FOR THE CORRECT SOLUTION
    TOO. At 200,000 that is 2 * 10^10 steps and the reference would have been
    the thing that timed out. 4,000 makes the degenerate-load point without
    punishing anybody, and case 10 -- 200,000 commands over 10 slots -- is
    where the load factor costs real time at 831 ms.
    Note the get() convention: -1 for a miss, which a stored -1 is
    indistinguishable from. That is the book's, and case 06 contains it
    deliberately so nobody discovers it by surprise.
