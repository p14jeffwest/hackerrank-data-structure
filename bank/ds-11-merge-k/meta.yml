  notes: >
    WHAT THIS PROBLEM CANNOT ENFORCE. Collecting every value into one array
    and calling Arrays.sort is O(N log N), and at these sizes it is not slower
    than the heap -- measured at 481 to 656 ms against the reference's 609 to
    751 ms. It cannot be excluded: the required output is the fully merged
    list, so any method producing a sorted sequence of the same values is
    right by definition.
    So the heap here is the taught method rather than the enforced one. What
    the problem does enforce is that the O(N*k) scan fails, which is the
    comparison the book's hint is actually about.
    Making the heap necessary would mean changing the question -- asking for
    only the first m values of the merge, with N far larger than m -- and that
    is no longer the book's problem. Flagged rather than done.
