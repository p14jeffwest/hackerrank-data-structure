# Corresponding problem in the Korean repo.
# Deliberately the same problem, so that one explanation serves both courses.
# The command set matches; the boundary behaviour does not, because the two
# books differ. The Korean 6.2 has enqueue on a full queue do nothing and
# dequeue on an empty one return -1; this book's 7.3 throws on full and
# returns null on empty. Each version follows its own book.
ko_counterpart: dsa-06-circular-queue
differs_from_ko:
  full_queue:
    ko: "enqueue does nothing, no output"
    en: "enqueue throws; the driver prints `full`"
  empty_queue:
    ko: "dequeue and peek print -1"
    en: "dequeue and getFront return null; the driver prints `empty`"

