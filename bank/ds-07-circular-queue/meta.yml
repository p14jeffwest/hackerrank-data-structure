  notes: >
    The two missing-modulo mistakes score the same 7/14 but fail different
    cases -- 02 06 07 08 10 12 13 for the write, 02 04 05 07 08 10 13 for the
    read -- so the score still points somewhere useful.
    Cases 00, 01, 03, 04, 05, 09 and 11 never need a wrap at all, which is
    what keeps those mistakes partial rather than total. gen.py reports, for
    each case, how many enqueues would run off the array without the modulo;
    that number is the one to look at when editing the data.
    A missing isFull check is the quietest of the five: enqueue overwrites the
    front element and the queue carries on answering, with the wrong contents
    rather than an error.
