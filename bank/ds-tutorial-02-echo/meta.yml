# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases_passed: 13
  date: "2026-08-09"
  scored_variants:
    - code: "BufferedReader.readLine()  (the registered solution)"
      score: "13/13"
    - code: "Scanner.nextLine()"
      score: "13/13"
    - code: "Scanner.next()   (the intended mistake)"
      score: "4/13"
  notes: >
    The four cases a next() solution passes are 00, 02, 04 and 10, the ones
    with no space in them. That partial score is the design: a zero would
    teach nothing, while 4/13 forces the student to ask which inputs broke.
    Case 01 is published as a sample so the gap is visible before submitting.
    All test files use LF line endings; the Korean repo's copies of this
    problem use CRLF, which readLine() happens to tolerate but which is worth
    not relying on.
