# Does this problem use a custom Head/Body/Tail code stub?
# No, and unlike ds-04-rotate that is deliberate rather than an oversight.
# The whole point is that none of the requested quantities depends on the
# stored values: they follow from the size and the capacity alone. A solution
# that builds an actual Array_List and moves elements is the WRONG answer
# here, and it times out. Handing the student a list would work against the
# idea the problem is testing.
