# Corresponding problem in the Korean repo.
# Taken over unchanged apart from the bounds. 14.3 of this book covers
# HashMap but sets no problem on it; the chapter's own exercises are
# intersection, anagrams, two sum and a chaining table, and none of them is
# the plain counting application that the section is about.
ko_counterpart: dsa-11-word-count
bounds_changed_from_ko:
  ko: "N <= 50,000, Q <= 50,000"
  here: "N <= 200,000, Q <= 200,000"

# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "371 ms (case 13, words at the maximum length)"
  scored_variants:
    - code: "one pass into a HashMap, then one lookup per query (the registered solution)"
      score: "14/14"
    - code: "scanning the list for every query, O(N*Q)"
      score: "8/14, timing out on 08 through 13"
    - code: "get() instead of getOrDefault()"
      score: "4/14, throwing on every case with a missing word"
    - code: "a HashSet, so every count comes out as 1"
      score: "5/14"
  notes: >
    The reference reads with StreamTokenizer in word mode rather than
    splitting lines by hand. At 400,000 words the reading is a real part of
    the runtime and it should not be what a student's score turns on -- but
    note that this problem uses the platform's default stub, so the reading is
    the student's own code and a slow reader is their problem to fix. The
    registered solution shows one way.
    The get()-instead-of-getOrDefault mistake throws rather than answering
    wrongly, so it fails every case containing a word that is not in the list.
    Cases 08, 09, 11 and 13 draw their queries only from words that do appear,
    which is what keeps it at 4/14 rather than 0.
