# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "389 ms (case 11, 500 trees totalling 200,000 nodes)"
  scored_variants:
    - code: "range narrowed with long bounds (the registered solution)"
      score: "14/14"
    - code: "each node compared only against its parent"
      score: "8/14, wrong on 02 06 08 10 11 13"
    - code: "bounds held in int rather than long"
      score: "12/14, wrong on 01 and 03"
    - code: "bounds compared with < and > so equal keys are allowed"
      score: "12/14, wrong on 03 and 04"
  notes: >
    Building the "locally consistent but globally invalid" trees took two
    attempts, and the failure is worth remembering. The first version of
    break_one() raised an arbitrary node in a left subtree; that node had
    children of its own, and raising it above them broke a parent-child pair
    as well -- which a parent-only check detects, so the case stopped testing
    what it existed for. The parent-only solution scored 11/14. break_one()
    now raises the RIGHTMOST node of the left subtree, which is above its own
    parent and above its own left child by construction, so nothing local
    changes and only the ancestor's bound is broken. That took it to 8/14.
    The int-bound mistake originally failed only one hidden case, which told a
    student nothing. Integer.MIN_VALUE and Integer.MAX_VALUE keys were added
    to sample 01 so it is visible before submitting.
