  slowest_case: "381 ms (cases 11 and 12)"
  scored_variants:
    - code: "two indices, both tails copied (the registered solution)"
      score: "14/14"
    - code: "only one of the two tails copied"
      score: "6/14"
    - code: "advancing both indices on a tie, dropping a value"
      score: "9/14"
    - code: "concatenate and call Arrays.sort"
      score: "14/14 -- not excluded; see the note"
  notes: >
    Concatenating and re-sorting cannot be excluded and was measured: 363 to
    422 ms against the merge's 380 to 381. At 400,000 values the log factor
    costs almost nothing. The book asks for the merge because it is the step
    merge sort is built from, not because sorting would be too slow, and the
    constraints say so directly rather than pretending the bound enforces it.
    An empty array writes its length and NO values line, rather than a blank
    one. The Tail reads with StreamTokenizer, which ignores line structure, so
    a blank line would carry no information and would only be something an
    editor or an archive could strip. gen.py's own summary had to be changed
    to read the files as token streams for the same reason.
