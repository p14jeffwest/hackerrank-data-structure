  notes: >
    The amortized requirement is the one thing in this problem that can be
    enforced, and it is enforced by the clock. The move-everything-back
    solution is the interesting one: its answers are correct everywhere, and
    it fails only on the five large cases. That is the cleanest demonstration
    in the whole set that a correct algorithm and an affordable one are
    different questions.
    The unconditional-refill mistake fails for a second and more instructive
    reason. Pouring the inbox onto a non-empty outbox buries older elements
    under newer ones, so the order breaks the moment an enqueue lands between
    two dequeues. Case 03 is nine commands long and shows it: the answer is
    1 2 3 9 and that solution prints 1 9 2 3.
