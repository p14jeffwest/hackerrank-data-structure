# Verification record
verified:
  jdk: "21.0.10"           # compiled with `javac --release 15 -Xlint:all`
  release_target: 15
  warnings: 0
  testcases: 14
  testcases_passed: 14
  slowest_case: "278 ms (case 08, T = 100,000 random pairs)"
  deepest_recursion: "43 calls (case 05 and case 10, consecutive Fibonacci numbers)"
  scored_variants:
    - code: "gcd(b, a % b) with a base case at b == 0 (the registered solution)"
      score: "14/14"
    - code: "base case at b == 1"
      score: "0/14"
    - code: "arguments the wrong way round: gcd(a % b, b)"
      score: "0/14, infinite recursion"
    - code: "subtraction instead of remainder"
      score: "8/14, StackOverflowError on the lopsided pairs"
    - code: "unmodified stub"
      score: "4/14 -- it returns 1, right for the coprime cases"
  notes: >
    The subtraction variant is the one worth showing. gcd(a-b, b) is correct
    mathematically and dies on (1, 999999999) with a StackOverflowError after
    a billion levels, which is exactly why Euclid's algorithm uses the
    remainder. It scores 8/14, so the failure is partial and points at the
    lopsided inputs.
    A fourth variant was written and discarded: a hand-rolled swap for the
    a < b case turned out to be correct. That is worth knowing when marking --
    the swap is unnecessary rather than wrong, because a % b is a when a < b,
    so the first call simply reverses them at the cost of one step.
    What no test can check is whether the method is recursive. `while (b != 0)`
    passes everything. Same limitation as ds-08-palindrome.
